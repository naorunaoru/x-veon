name: Promote a ref to stable

# Builds `ref` as the stable channel, tags it stable/<date>, publishes a GitHub
# Release with the site bundle (which becomes "Latest"), then redeploys both channels.
# Convention: merge develop into main first, then promote main. See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and release as stable
        required: true
        default: main
      notes:
        description: Extra release notes (optional)
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build stable
        working-directory: web
        env:
          XV_CHANNEL: stable
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
          npx tsc --noEmit
          test -f dist/index.html
          grep -q '/x-veon/assets/' dist/index.html
          test -f dist/checkpoints/models.json
          test -s dist/lensfun/index.json
          grep -q '"file"' dist/lensfun/index.json
          (cd dist && find . -type f | sort | xargs sha256sum) > "$RUNNER_TEMP/MANIFEST.sha256"
          cp "$RUNNER_TEMP/MANIFEST.sha256" dist/MANIFEST.sha256
          (cd dist && zip -qr "$RUNNER_TEMP/site-stable.zip" .)

      - name: Tag
        id: tag
        run: |
          set -euo pipefail
          date="$(date -u +%F)"
          label="$date"; n=1
          while git rev-parse -q --verify "refs/tags/stable/$label" >/dev/null; do
            n=$((n+1)); label="$date-$n"
          done
          tag="stable/$label"
          sha="$(git rev-parse HEAD)"
          decoder="$(git -C web/wasm/vendor/rawloader rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "stable release $label" -m "source: $sha" -m "decoder: $decoder" HEAD
          git push origin "refs/tags/$tag"
          {
            echo "tag=$tag"; echo "label=$label"; echo "sha=$sha"; echo "decoder=$decoder"
          } >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          LABEL: ${{ steps.tag.outputs.label }}
          SHA: ${{ steps.tag.outputs.sha }}
          DECODER: ${{ steps.tag.outputs.decoder }}
          REF: ${{ inputs.ref }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          {
            printf 'Source: %s (%s)\n' "$SHA" "$REF"
            printf 'Decoder (rawloader submodule): %s\n\n' "$DECODER"
            printf '%s\n' "$NOTES"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            "$RUNNER_TEMP/site-stable.zip" "$RUNNER_TEMP/MANIFEST.sha256" \
            --title "stable $LABEL" --notes-file "$RUNNER_TEMP/notes.md" --latest

  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yml
