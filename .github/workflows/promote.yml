name: Promote a ref to stable

# Builds `ref` as the stable channel, tags it stable/<date>, publishes a GitHub
# Release with the site bundle (which becomes "Latest"), then redeploys both channels
# and dispatches desktop.yml to attach the desktop installers.
# Convention: merge develop into main first, then promote main. See RELEASING.md.
# The checkout may use either repository layout (see deploy.yml). dry_run builds and checks the bundle only.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and release as stable
        required: true
        default: main
      notes:
        description: Extra release notes (optional)
        required: false
        default: ''
      dry_run:
        description: Build and check the stable bundle, but don't tag, release or deploy
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Build stable
        env:
          XV_CHANNEL: stable
        run: |
          set -euo pipefail
          if [[ -f scripts/build-web.sh ]]; then
            bash scripts/build-web.sh stable
          else
            # Older web/-only layout: the steps scripts/build-web.sh replaced.
            (cd web && npm ci && npm test && npm run build && npx tsc --noEmit)
          fi
          cd web
          test -f dist/index.html
          grep -q '/x-veon/assets/' dist/index.html
          test -f dist/checkpoints/models.json
          test -s dist/lensfun/index.json
          grep -q '"file"' dist/lensfun/index.json
          (cd dist && find . -type f | sort | xargs sha256sum) > "$RUNNER_TEMP/MANIFEST.sha256"
          cp "$RUNNER_TEMP/MANIFEST.sha256" dist/MANIFEST.sha256
          (cd dist && zip -qr "$RUNNER_TEMP/site-stable.zip" .)

      - name: Tag
        id: tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          date="$(date -u +%F)"
          label="$date"; n=1
          while git rev-parse -q --verify "refs/tags/stable/$label" >/dev/null; do
            n=$((n+1)); label="$date-$n"
          done
          tag="stable/$label"
          sha="$(git rev-parse HEAD)"
          decoder_dir=web/wasm/vendor/rawloader
          if [[ -d shared/crates/vendor/rawloader ]]; then decoder_dir=shared/crates/vendor/rawloader; fi
          decoder="$(git -C "$decoder_dir" rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "stable release $label" -m "source: $sha" -m "decoder: $decoder" HEAD
          git push origin "refs/tags/$tag"
          {
            echo "tag=$tag"; echo "label=$label"; echo "sha=$sha"; echo "decoder=$decoder"
          } >> "$GITHUB_OUTPUT"

      - name: Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          LABEL: ${{ steps.tag.outputs.label }}
          SHA: ${{ steps.tag.outputs.sha }}
          DECODER: ${{ steps.tag.outputs.decoder }}
          REF: ${{ inputs.ref }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          {
            printf 'Source: %s (%s)\n' "$SHA" "$REF"
            printf 'Decoder (rawloader submodule): %s\n\n' "$DECODER"
            printf '%s\n' "$NOTES"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            "$RUNNER_TEMP/site-stable.zip" "$RUNNER_TEMP/MANIFEST.sha256" \
            --title "stable $LABEL" --notes-file "$RUNNER_TEMP/notes.md" --latest

  deploy:
    needs: release
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/deploy.yml

  desktop:
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch desktop.yml for the new stable tag
      contents: read
    steps:
      - name: Dispatch the desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        # A tag a workflow creates can't trigger desktop.yml's tag push, so dispatch it. This is its own
        # job: if the dispatch fails, the deploy job, which needs only the release, still runs.
        run: gh workflow run desktop.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$TAG"
