name: Deploy channels to GitHub Pages

# Two channels, one Pages site:
#   stable  /x-veon/       = the GitHub Release marked "Latest" (asset site-stable.zip), never rebuilt here
#   beta    /x-veon/beta/  = the newest annotated beta/* tag, built from source
# Nothing deploys on a branch push. See RELEASING.md.
# The beta source may use either repository layout: shared/ + web/ with scripts/build-web.sh, or the
# older web/-only one. main's copy of this file builds both, so it must stay identical to develop's.

on:
  push:
    tags: ['beta/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check the site, but don't upload or deploy it
        type: boolean
        default: false
      beta_ref:
        description: Dry runs only - build beta from this branch, tag or commit instead of the newest beta tag
        type: string
        default: ''
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A dry run gets a group of its own: GitHub keeps one pending run per group and cancels the older one,
  # so sharing 'pages' would let a dry run cancel a real deploy that is waiting.
  group: ${{ inputs.dry_run == true && format('pages-dry-run-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      stable_tag: ${{ steps.stable.outputs.tag }}
      beta_tag: ${{ steps.beta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve stable (latest release, must be on a stable/* tag)
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" || { echo "::error::No GitHub Release found for ${GITHUB_REPOSITORY}; run promote.yml (or publish a stable/* release) first"; exit 1; }
          case "$tag" in
            stable/*) ;;
            *) echo "::error::Latest release '$tag' is not on a stable/* tag; refusing to deploy"; exit 1 ;;
          esac
          gh release download "$tag" --pattern site-stable.zip --dir "$RUNNER_TEMP"
          mkdir -p site
          unzip -q "$RUNNER_TEMP/site-stable.zip" -d site
          test -f site/index.html || { echo "::error::site-stable.zip has no index.html at its root"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "stable = $tag"

      - name: Resolve beta (newest annotated beta/* tag)
        id: beta
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          BETA_REF: ${{ inputs.beta_ref }}
        run: |
          set -euo pipefail
          if [[ -n "${BETA_REF:-}" ]]; then
            if [[ "${DRY_RUN:-}" != "true" ]]; then
              echo "::error::beta_ref is only for dry runs (set dry_run)"
              exit 1
            fi
            echo "tag=${BETA_REF}" >> "$GITHUB_OUTPUT"
            echo "beta = ${BETA_REF} (dry run)"
            exit 0
          fi
          # actions/checkout fetches the triggering tag as a lightweight ref pointing at the
          # commit, which discards the annotated tag object; re-fetch tags with --force so the
          # annotated check and the tagger-date ordering below see the real tag objects.
          git fetch --force --tags --quiet origin
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == beta/* ]]; then
            if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
              echo "::error::${GITHUB_REF_NAME} is a lightweight tag; beta tags must be annotated (git tag -a)"
              exit 1
            fi
          fi
          newest="$(git for-each-ref 'refs/tags/beta/*' --format='%(objecttype) %(taggerdate:unix) %(refname:short)' \
            | awk '$1 == "tag"' | sort -k2,2nr | head -n1 | awk '{print $3}')"
          if [[ -z "$newest" ]]; then
            echo "::warning::No annotated beta/* tag found; deploying stable only"
          fi
          echo "tag=$newest" >> "$GITHUB_OUTPUT"
          echo "beta = ${newest:-<none>}"

      - name: Check out beta source
        if: steps.beta.outputs.tag != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.beta.outputs.tag }}
          path: beta-src
          submodules: true
          lfs: true

      - name: Rust toolchain
        if: steps.beta.outputs.tag != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Node
        if: steps.beta.outputs.tag != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'beta-src/**/package-lock.json'

      - name: Build beta
        if: steps.beta.outputs.tag != ''
        working-directory: beta-src
        env:
          XV_CHANNEL: beta
        run: |
          set -euo pipefail
          if [[ -f scripts/build-web.sh ]]; then
            bash scripts/build-web.sh beta
          else
            # Older web/-only layout: the steps scripts/build-web.sh replaced.
            (cd web && npm ci && npm test && npm run build && npx tsc --noEmit)
          fi
          rm -rf ../site/beta
          mv web/dist ../site/beta

      - name: Sanity-check the assembled site
        env:
          BETA_TAG: ${{ steps.beta.outputs.tag }}
        run: |
          set -euo pipefail
          test -f site/index.html
          if [[ -n "$BETA_TAG" ]]; then
            test -f site/beta/index.html
            test -f site/beta/checkpoints/models.json
            test -s site/beta/lensfun/index.json
            grep -q '"file"' site/beta/lensfun/index.json
            grep -q '/x-veon/beta/assets/' site/beta/index.html
          fi
          du -sh site site/beta 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.dry_run != true }}
        with:
          path: site

  deploy:
    needs: assemble
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
