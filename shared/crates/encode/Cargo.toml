[package]
name = "xveon-encode"
version = "0.1.0"
edition = "2021"
publish = false
description = "X-veon's export encoders (AVIF, Ultra HDR JPEG, TIFF): the core the WASM and native builds share"

[lib]
crate-type = ["rlib"]

[features]
# Desktop only (spec §7): rav1e's assembly (NASM on x86_64) and its thread pool.
asm = ["rav1e/asm"]
threading = ["rav1e/threading"]
native = ["asm", "threading"]

[dependencies]
jpeg-encoder = "0.6"
tiff = "0.9"
rav1e = { version = "0.7", default-features = false }
avif-serialize = "0.8"
libm = "=0.2.16"
